<!doctype html>
<html lang="en" class="dark">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Unbreakable Health Summit - MetFix PWA</title>    
    
    <!-- Google Fonts for Luxury Editorial Design -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- PWA Theme Color -->
    <meta name="theme-color" content="#070707" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    
    <!-- Favicon and iOS Apple Touch Icon -->
    <link rel="icon" type="image/png" href="https://brokenscience.org/wp-content/uploads/2026/02/bronze-logo-2x.png" />
    <link rel="apple-touch-icon" href="https://brokenscience.org/wp-content/uploads/2026/02/bronze-logo-2x.png" />
    
    <!-- iOS Splash Screens (High-Contrast Black & Gold Startup Images using Bronze Logo) -->
    <!-- iPhone 15 Pro Max, 14 Pro Max -->
    <link rel="apple-touch-startup-image" href="https://brokenscience.org/wp-content/uploads/2026/02/bronze-logo-2x.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 15 Pro, 15, 14 Pro -->
    <link rel="apple-touch-startup-image" href="https://brokenscience.org/wp-content/uploads/2026/02/bronze-logo-2x.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />

    <link rel="apple-touch-startup-image" href="https://brokenscience.org/wp-content/uploads/2026/02/bronze-logo-2x.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <!-- iPhone 14, 13 Pro, 13, 12 Pro, 12 -->
    <link rel="apple-touch-startup-image" href="https://brokenscience.org/wp-content/uploads/2026/02/bronze-logo-2x.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />

    <link rel="apple-touch-startup-image" href="https://brokenscience.org/wp-content/uploads/2026/02/bronze-logo-2x.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" />
